name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: go build -o vrestic .

  release:
    needs: test
    uses: thorix/ci/.github/workflows/docker-build.yml@main
    with:
      image: library/vrestic
      deploy_values_path: vrestic/values.prod.yaml
      tag: ${{ github.event.inputs.version || github.ref_name }}
      build_args: |
        VERSION=${{ github.event.inputs.version || github.ref_name }}
        CACHE_REGISTRY=harbor.thorix.io/dockerhub-cache/library/
    secrets: inherit
